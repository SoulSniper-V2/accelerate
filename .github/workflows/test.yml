name: Run Tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/**"
      - "examples/**"
      - "setup.py"
      - "Makefile"
    types: [opened, synchronize, reopened]

env:
  HF_HOME: ~/hf_cache
  TESTING_MOCKED_DATALOADERS: "1"
  IS_GITHUB_CI: "1"

permissions: {}

jobs:
  run-tests:
    if: github.repository == 'huggingface/accelerate'
    permissions:
      contents: read
    runs-on:
      group: aws-general-8-plus
    strategy:
      fail-fast: false
      matrix:
        pytorch-version: [
          latest,
          minimum,
        ]
        test-kind: [
          test_prod,
          test_core,
          test_cli,
          test_big_modeling,
          test_deepspeed,
          test_fsdp,
          test_example_differences,
          test_checkpoint_step,
          test_checkpoint_epoch,
          test_rest
        ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'setup.py'
    
    - name: Install the library
      run: |
        if [[ ${{ matrix.test-kind }} = test_prod ]]; then pip install -e .[test_prod]; fi
        if [[ ${{ matrix.test-kind }} != test_prod ]]; then pip install -e .[testing,test_trackers]; fi
        if [[ ${{ matrix.pytorch-version }} = minimum ]]; then pip install torchvision==0.20.1 torch==2.5.1; fi
        pip install pytest-reportlog tabulate setuptools importlib_metadata

    - name: Show installed libraries
      run: |
        pip freeze
    
    - name: Run Tests
      env: 
        PYTORCH_VERSION: ${{ matrix.pytorch-version }}
      run: |
        make ${{ matrix.test-kind }}

    - name: Generate Report
      if: always()
      run: |
        python utils/log_reports.py >> $GITHUB_STEP_SUMMARY

  fork-cpu:
    if: github.repository != 'huggingface/accelerate'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            torch-version: '2.5.1'
          - python-version: '3.14'
            torch-version: '2.14.1'
    env:
      HF_HOME: ${{ runner.temp }}/hf-cache
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'setup.py'
    - name: Install CPU PyTorch and the library
      env:
        TORCH_VERSION: ${{ matrix.torch-version }}
      run: |
        python -m pip install "torch==$TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
        python -m pip install '.[test_prod]'
        python -m pip check
    - name: Test CPU runtime and checkpoint handling
      run: make test_cpu
    - name: Check the installed CLI
      run: |
        accelerate env
        accelerate config default --config_file "$RUNNER_TEMP/accelerate.yaml"
        accelerate test --config_file "$RUNNER_TEMP/accelerate.yaml"
